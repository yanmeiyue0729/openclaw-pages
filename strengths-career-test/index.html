<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优势 × 职业 综合测评</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif;background:#f0eeff;min-height:100vh;color:#1f2937}
#home{max-width:760px;margin:0 auto;padding:52px 20px 64px}
.home-hd{text-align:center;margin-bottom:44px}
.home-hd h1{font-size:26px;font-weight:800;color:#1a1333;margin-bottom:10px}
.home-hd p{font-size:14px;color:#7c6fa0;line-height:1.7}
.author{font-size:12px;color:#b0a3cc;margin-top:14px}
.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:540px){.cards-row{grid-template-columns:1fr}}
.tcard{background:white;border-radius:22px;padding:30px 18px 26px;cursor:pointer;border:2px solid transparent;transition:all .2s;box-shadow:0 4px 16px rgba(100,80,200,.07);text-align:center;position:relative}
.tcard:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(100,80,200,.15)}
.tc-icon{font-size:46px;margin-bottom:14px;display:block}.tcard h2{font-size:16px;font-weight:700;color:#1a1333;margin-bottom:6px}
.tcard p{font-size:12px;color:#a89fc0;margin-bottom:14px;line-height:1.5}
.tc-badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px}
.tc-done{position:absolute;top:12px;right:12px;font-size:16px}
.tcard-g{border-color:#e8e4ff}.tcard-g:hover{border-color:#7c6ff7}.tcard-g .tc-badge{background:#ede9fe;color:#5b21b6}
.tcard-h{border-color:#ffefd9}.tcard-h:hover{border-color:#f59e0b}.tcard-h .tc-badge{background:#fef3c7;color:#92400e}
.tcard-m{border-color:#d3f9ee}.tcard-m:hover{border-color:#10b981}.tcard-m .tc-badge{background:#d1fae5;color:#065f46}
.combo-card{background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);border-radius:22px;padding:22px 28px;cursor:pointer;transition:all .2s;box-shadow:0 6px 24px rgba(99,102,241,.25);display:flex;align-items:center;gap:16px;color:white}
.combo-card:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(99,102,241,.4)}
.cc-icon{font-size:36px;flex-shrink:0}.combo-card h2{font-size:17px;font-weight:800;margin-bottom:3px}.combo-card p{font-size:12px;opacity:.85}
.cc-arrow{margin-left:auto;font-size:20px;opacity:.7}
.combo-locked{opacity:.5;cursor:not-allowed}.combo-locked:hover{transform:none;box-shadow:0 6px 24px rgba(99,102,241,.25)}
.combo-hint{font-size:11px;color:#a89fc0;text-align:center;margin-top:8px}
#test-view{display:none;max-width:600px;margin:0 auto;padding:24px 20px 60px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:#7c6fa0;font-size:13px;cursor:pointer;padding:8px 0;margin-bottom:18px;background:none;border:none}
.prog-wrap{margin-bottom:24px}
.prog-top{display:flex;justify-content:space-between;margin-bottom:8px}
.prog-lbl{font-size:12px;color:#a89fc0;font-weight:600}.prog-num{font-size:12px;font-weight:700;color:#6366f1}
.prog-track{height:5px;background:#e9e4ff;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .3s}
.fill-g{background:linear-gradient(90deg,#6366f1,#8b5cf6)}.fill-h{background:linear-gradient(90deg,#f59e0b,#f97316)}.fill-m{background:linear-gradient(90deg,#10b981,#059669)}
/* 盖洛普：每页多对，5档量表 */
.g-page{background:white;border-radius:20px;padding:20px 16px;box-shadow:0 4px 20px rgba(100,80,200,.08);animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.g-pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid #f3f0ff}
.g-pair:last-of-type{border:none}
.g-txt{font-size:12px;color:#374151;line-height:1.45}.g-txt-a{text-align:right}.g-txt-b{text-align:left}
.g-scale{display:flex;gap:5px;align-items:center;flex-shrink:0}
.g-btn{width:26px;height:26px;border-radius:50%;border:2px solid;cursor:pointer;transition:all .1s;background:transparent;flex-shrink:0;padding:0}
.g-btn:hover{transform:scale(1.15)}
.g-btn-a1{border-color:#10b981}.g-btn-a1.sel{background:#10b981}
.g-btn-a2{border-color:#10b981;opacity:.55}.g-btn-a2.sel{background:#10b981;opacity:.8}
.g-btn-n{border-color:#9ca3af;width:20px;height:20px}.g-btn-n.sel{background:#9ca3af}
.g-btn-b2{border-color:#f59e0b;opacity:.55}.g-btn-b2.sel{background:#f59e0b;opacity:.8}
.g-btn-b1{border-color:#f59e0b}.g-btn-b1.sel{background:#f59e0b}
.page-nav{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.nav-btn{flex:1;padding:12px;border-radius:14px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.nav-prev{background:#f3f0ff;color:#7c6fa0}.nav-prev:hover{background:#e9e4ff}
.nav-next{background:#6366f1;color:white}.nav-next:hover{background:#4f46e5}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
/* 霍兰德 & MBTI */
.qcard{background:white;border-radius:22px;padding:32px 24px 28px;box-shadow:0 4px 20px rgba(100,80,200,.08);animation:fadeIn .18s ease}
.qcard h3{font-size:16px;font-weight:600;color:#1a1333;line-height:1.55;text-align:center;margin-bottom:22px}
.h2-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.h2-opt{padding:18px 10px;border-radius:16px;border:2px solid #e5e7eb;cursor:pointer;background:white;text-align:center;font-size:14px;font-weight:600;color:#4b5563;transition:all .1s}
.h2-opt:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.h2-opt.yes{background:#f59e0b;border-color:#f59e0b;color:white}
.h2-opt.nope{background:#e5e7eb;border-color:#d1d5db;color:#6b7280}
.m-opts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:20px}
.m-opt{padding:14px 4px;border-radius:14px;border:2px solid #e5e7eb;cursor:pointer;background:white;text-align:center;font-size:11px;font-weight:600;color:#6b7280;transition:all .1s;line-height:1.3}
.m-opt:hover{transform:translateY(-2px)}.m-opt.sel{color:white}
.prev-row{margin-top:14px}.prev-link{background:none;border:none;color:#a89fc0;font-size:12px;cursor:pointer}
/* 结果页 */
.result-wrap{display:none;max-width:640px;margin:0 auto;padding:24px 20px 60px;animation:fadeIn .3s ease}
.rhero{text-align:center;padding:30px 24px 26px;background:white;border-radius:24px;box-shadow:0 4px 18px rgba(100,80,200,.08);margin-bottom:14px}
.re{font-size:50px;margin-bottom:10px}.rhero h2{font-size:20px;font-weight:800;color:#1a1333;margin-bottom:6px}
.rhero p{font-size:13px;color:#7c6fa0;line-height:1.6}
.rcard{background:white;border-radius:20px;padding:22px;margin-bottom:12px;box-shadow:0 2px 12px rgba(100,80,200,.06)}
.rcard h3{font-size:14px;font-weight:700;color:#1a1333;margin-bottom:14px}
.ins-item{border-left:3px solid;padding:10px 12px;margin-bottom:9px;border-radius:0 12px 12px 0}
.ins-item h4{font-size:12px;font-weight:700;margin-bottom:3px}.ins-item p{font-size:12px;color:#4b5563;line-height:1.55}
.redo-btn{width:100%;padding:13px;border-radius:14px;border:2px solid #e5e7eb;background:white;color:#7c6fa0;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.redo-btn:hover{background:#f7f5ff}
.hb-row{margin-bottom:11px}.hb-top{display:flex;justify-content:space-between;margin-bottom:5px}
.hb-nm{font-size:12px;font-weight:700}.hb-sc{font-size:11px;color:#a89fc0}
.hb-track{height:9px;background:#f3f0ff;border-radius:5px;overflow:hidden}
.hb-fill{height:100%;border-radius:5px;transition:width 1.1s ease}
.h-type-table{width:100%;border-collapse:collapse;font-size:11.5px}
.h-type-table th{background:#1a1333;color:white;padding:8px 10px;text-align:left;font-weight:700}
.h-type-table td{padding:9px 10px;border-bottom:1px solid #f3f0ff;vertical-align:top;line-height:1.5}
.h-type-table tr.top3 td{background:#fffbf0}
.h-combo-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.h-combo-table th{background:#1a1333;color:white;padding:8px 10px;text-align:left;font-size:11px;font-weight:700}
.h-combo-table td{padding:8px 10px;border-bottom:1px solid #f3f0ff;vertical-align:top;line-height:1.5}
.mbti-type-big{font-size:52px;font-weight:900;margin:8px 0}
.mbti-role-tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px;margin-bottom:10px}
.mbti-dim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.mbti-dim{background:#f7f5ff;border-radius:14px;padding:12px 14px}
.mbti-dim .dd-label{font-size:11px;color:#a89fc0;margin-bottom:6px;font-weight:600}
.mbti-dim .dd-bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:4px}
.mbti-dim .dd-fill{height:100%;border-radius:4px;transition:width 1s ease}
.mbti-dim .dd-vals{display:flex;justify-content:space-between;font-size:10px;color:#6b7280;font-weight:600}
.mbti-pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mbti-pros{background:#f0fdf4;border-radius:14px;padding:14px}
.mbti-cons{background:#fff1f2;border-radius:14px;padding:14px}
.mbti-pros h5{font-size:11px;font-weight:700;color:#065f46;margin-bottom:8px}
.mbti-cons h5{font-size:11px;font-weight:700;color:#9f1239;margin-bottom:8px}
.mbti-pros li,.mbti-cons li{font-size:11px;line-height:1.7;margin-left:14px;color:#374151}
.cc1{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd;display:inline-block;margin:3px}
.cc2{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;display:inline-block;margin:3px}
#combo-result{display:none;max-width:640px;margin:0 auto;padding:24px 20px 60px;animation:fadeIn .3s ease}
.combo-hero{text-align:center;padding:32px 24px 28px;border-radius:24px;margin-bottom:14px;color:white;background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);box-shadow:0 8px 28px rgba(99,102,241,.3)}
.combo-hero h2{font-size:22px;font-weight:800;margin-bottom:8px}.combo-hero p{font-size:13px;opacity:.9;line-height:1.6}
.combo-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.combo-tag{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.career-table{width:100%;border-collapse:collapse;font-size:12px}
.career-table th{background:#1a1333;color:white;padding:8px 10px;text-align:left;font-size:11px;font-weight:700}
.career-table td{padding:9px 10px;border-bottom:1px solid #f3f0ff;vertical-align:top;line-height:1.5}
.t1{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;display:inline-block}
.t2{background:#e0f2fe;color:#075985;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;display:inline-block}
</style>
</head>
<body>
<div id="home">
  <div class="home-hd">
    <h1>✨ 优势 × 职业 综合测评</h1>
    <p>三套独立测试，点击任意一项开始<br>全部完成后可生成综合职业分析报告</p>
    <div class="author">「一个身怀绝技的神秘大美人🌙 」制作 · 仅供娱乐</div>
  </div>
  <div class="cards-row">
    <div class="tcard tcard-g" onclick="startGallup()">
      <span class="tc-done" id="done-g" style="display:none">✅</span>
      <span class="tc-icon">💎</span><h2>盖洛普优势</h2><p>发现你的天赋强项</p><span class="tc-badge">180 道配对题</span>
    </div>
    <div class="tcard tcard-h" onclick="startHolland()">
      <span class="tc-done" id="done-h" style="display:none">✅</span>
      <span class="tc-icon">🎯</span><h2>霍兰德职业兴趣</h2><p>找到你的职业类型</p><span class="tc-badge">90 道兴趣题</span>
    </div>
    <div class="tcard tcard-m" onclick="startMbti()">
      <span class="tc-done" id="done-m" style="display:none">✅</span>
      <span class="tc-icon">🧬</span><h2>MBTI 人格测试</h2><p>发现你的人格类型</p><span class="tc-badge">60 道量表题</span>
    </div>
  </div>
  <div class="combo-card combo-locked" id="combo-btn" onclick="tryCombo()">
    <div class="cc-icon">🔮</div>
    <div><h2>综合职业分析</h2><p id="combo-sub">完成全部三项测试后解锁</p></div>
    <div class="cc-arrow">›</div>
  </div>
  <div class="combo-hint">已完成 <span id="done-count">0</span> / 3 项</div>
</div>

<div id="test-view">
  <button class="back-btn" onclick="goHome()">← 返回首页</button>
  <div class="prog-wrap">
    <div class="prog-top"><span class="prog-lbl" id="prog-lbl"></span><span class="prog-num" id="prog-num"></span></div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div id="q-content"></div>
  <div class="prev-row"><button class="prev-link" id="btn-prev" onclick="prevQ()" style="display:none">← 上一题</button></div>
</div>

<div id="gallup-result" class="result-wrap">
  <button class="back-btn" onclick="goHome()">← 返回首页</button>
  <div id="gallup-result-content"></div>
  <button class="redo-btn" onclick="startGallup()">🔄 重新测试</button>
</div>
<div id="holland-result" class="result-wrap">
  <button class="back-btn" onclick="goHome()">← 返回首页</button>
  <div id="holland-result-content"></div>
  <button class="redo-btn" onclick="startHolland()">🔄 重新测试</button>
</div>
<div id="mbti-result" class="result-wrap">
  <button class="back-btn" onclick="goHome()">← 返回首页</button>
  <div id="mbti-result-content"></div>
  <button class="redo-btn" onclick="startMbti()">🔄 重新测试</button>
</div>
<div id="combo-result">
  <button class="back-btn" onclick="goHome()">← 返回首页</button>
  <div id="combo-result-content"></div>
</div>

<script>
// ════ 盖洛普 34项主题 ════
const ST=[
  {id:'achiever',    name:'成就',   domain:'exec',     desc:'无论完成多少，总渴望更多——强烈的内驱力，停不下来'},
  {id:'arranger',    name:'统筹',   domain:'exec',     desc:'善于协调多种任务和资源，享受动态管理的复杂局面'},
  {id:'belief',      name:'信仰',   domain:'exec',     desc:'有不变的核心价值观，这些价值观给生活带来意义'},
  {id:'consistency', name:'公平',   domain:'exec',     desc:'相信所有人应被平等对待，依照规则行事'},
  {id:'deliberative',name:'审慎',   domain:'exec',     desc:'行动前仔细评估，识别风险，决策谨慎'},
  {id:'discipline',  name:'纪律',   domain:'exec',     desc:'需要秩序和规划，把混乱的世界整理成有序结构'},
  {id:'focus',       name:'专注',   domain:'exec',     desc:'确定方向后排除干扰，始终对准目标'},
  {id:'responsibility',name:'责任', domain:'exec',     desc:'对承诺有强烈情感约束，不完成誓不罢休'},
  {id:'restorative', name:'排难',   domain:'exec',     desc:'喜欢解决问题，遇到麻烦会去钻研而非绕开'},
  {id:'activator',   name:'行动',   domain:'influence',desc:'想法要马上付诸行动，按下就开始'},
  {id:'command',     name:'统率',   domain:'influence',desc:'不回避冲突，主动接管局面，带来清晰方向'},
  {id:'communication',name:'沟通',  domain:'influence',desc:'把想法转化为故事和语言，善于抓住听众'},
  {id:'competition', name:'竞争',   domain:'influence',desc:'以他人为参照，渴望排名第一'},
  {id:'maximizer',   name:'追求',   domain:'influence',desc:'专注把优势从良好提升到卓越，不满足于平均'},
  {id:'self_assurance',name:'自信', domain:'influence',desc:'相信自己的判断和能力，内心有一种确信感'},
  {id:'significance',name:'荣耀',   domain:'influence',desc:'渴望被他人认为重要、有价值、有影响力'},
  {id:'woo',         name:'取悦',   domain:'influence',desc:'享受认识陌生人，善于打破僵局，赢得好感'},
  {id:'adaptability',name:'适应',   domain:'relation', desc:'活在当下，随机应变，把意外变成可能性'},
  {id:'connectedness',name:'关联',  domain:'relation', desc:'相信万物相连，有更大的目的和整体感'},
  {id:'developer',   name:'伯乐',   domain:'relation', desc:'发现他人潜力，喜欢看到别人成长'},
  {id:'empathy',     name:'体谅',   domain:'relation', desc:'能感受到他人的情绪，情绪感知力极强'},
  {id:'harmony',     name:'和谐',   domain:'relation', desc:'寻求共识，避免摩擦，在不同意见中找平衡点'},
  {id:'includer',    name:'包容',   domain:'relation', desc:'关注被边缘化的人，让每个人都有归属感'},
  {id:'individualization',name:'个别',domain:'relation',desc:'着迷于每个人的独特特质，不喜欢一刀切'},
  {id:'positivity',  name:'积极',   domain:'relation', desc:'热情感染他人，充满活力，让周围人振奋'},
  {id:'relator',     name:'交往',   domain:'relation', desc:'享受与亲近者建立深度关系，投入真实情感'},
  {id:'analytical',  name:'分析',   domain:'strategy', desc:'寻找影响事物的原因和规律，数据和逻辑是武器'},
  {id:'context',     name:'回顾',   domain:'strategy', desc:'通过研究过去来理解现在，历史是坐标系'},
  {id:'futuristic',  name:'前瞻',   domain:'strategy', desc:'被对未来的愿景激励，喜欢描绘可能性'},
  {id:'ideation',    name:'思维',   domain:'strategy', desc:'着迷于想法，擅长在看似无关的事物间找联系'},
  {id:'input',       name:'搜集',   domain:'strategy', desc:'渴望了解更多，收集信息、想法和资料'},
  {id:'intellection',name:'沉思',   domain:'strategy', desc:'享受深度思考，内省，喜欢有独处思考的时间'},
  {id:'learner',     name:'学习',   domain:'strategy', desc:'热爱学习过程本身，持续进步带来满足感'},
  {id:'strategic',   name:'战略',   domain:'strategy', desc:'能在混乱中找到模式，快速看出最佳路径'},
];
const DC={exec:'#5b21b6',influence:'#9d174d',relation:'#1e40af',strategy:'#065f46'};
const DB={exec:'#ede9fe',influence:'#fce7f3',relation:'#dbeafe',strategy:'#d1fae5'};
const DL={exec:'#f5f3ff',influence:'#fdf2f8',relation:'#eff6ff',strategy:'#f0fdf4'};
const DN={exec:'执行力',influence:'影响力',relation:'关系建立',strategy:'战略思维'};

// 180道题 [idxA, 左侧描述, idxB, 右侧描述]
// idxA/idxB 对应 ST 数组下标（0-33），做题人偏左得A分，偏右得B分
const GRAW=[
  [0,'我乐于助人',8,'我喜欢把东西拆开，了解其工作原理'],
  [28,'我喜欢与关注未来的人交往',27,'我喜欢和历史学家交往'],
  [16,'我想要每个人都喜欢我',15,'我想要人们崇拜我'],
  [12,'我力争第一',0,'我重在参与'],
  [0,'我一贯努力工作',4,'我做事进展较慢，但确保成效'],

const S={mode:'',gAns:{},hAns:{},mAns:{},gPage:0,hTypes:['R','I','A','S','E','C'],hType:'R',hIdx:0,mIdx:0,done:{g:false,h:false,m:false},results:{g:null,h:null,m:null}};

function showOnly(id){['home','test-view','gallup-result','holland-result','mbti-result','combo-result'].forEach(x=>{const el=document.getElementById(x);if(el)el.style.display=x===id?'block':'none';});}
function goHome(){showOnly('home');updateHomeStatus();}
function updateHomeStatus(){
  const cnt=Object.values(S.done).filter(Boolean).length;
  document.getElementById('done-count').textContent=cnt;
  ['g','h','m'].forEach(k=>{document.getElementById('done-'+k).style.display=S.done[k]?'inline':'none';});
  const btn=document.getElementById('combo-btn'),sub=document.getElementById('combo-sub');
  if(cnt===3){btn.classList.remove('combo-locked');sub.textContent='点击查看你的综合职业画像';}
  else{btn.classList.add('combo-locked');sub.textContent='完成全部三项测试后解锁（还差'+(3-cnt)+'项）';}
}
function tryCombo(){if(!S.done.g||!S.done.h||!S.done.m)return;showComboResult();}

function startGallup(){S.mode='gallup';S.gPage=0;S.gAns={};showOnly('test-view');document.getElementById('btn-prev').style.display='none';renderGPage();}

function renderGPage(){
  const page=S.gPage,start=page*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,GRAW.length);
  const totalPages=Math.ceil(GRAW.length/PAGE_SIZE);
  document.getElementById('prog-lbl').textContent='GALLUP 优势识别';
  document.getElementById('prog-num').textContent='第'+(page+1)+'页 / 共'+totalPages+'页';
  const fill=document.getElementById('prog-fill');
  fill.style.width=Math.round(page/totalPages*100)+'%';fill.className='prog-fill fill-g';
  let html='';
  for(let i=start;i<end;i++){
    const[idxA,dA,idxB,dB]=GRAW[i],v=S.gAns[i];
    html+=`<div class="g-pair" id="gpr-${i}">
      <div class="g-txt g-txt-a">${dA}</div>
      <div class="g-scale">
        <button class="g-btn g-btn-a1${v===2?' sel':''}" onclick="setGA(${i},2)"></button>
        <button class="g-btn g-btn-a2${v===1?' sel':''}" onclick="setGA(${i},1)"></button>
        <button class="g-btn g-btn-n${v===0?' sel':''}" onclick="setGA(${i},0)"></button>
        <button class="g-btn g-btn-b2${v===-1?' sel':''}" onclick="setGA(${i},-1)"></button>
        <button class="g-btn g-btn-b1${v===-2?' sel':''}" onclick="setGA(${i},-2)"></button>
      </div>
      <div class="g-txt g-txt-b">${dB}</div>
    </div>`;
  }
  const isLast=page>=totalPages-1;
  document.getElementById('q-content').innerHTML=`<div class="g-page">${html}
    <div class="page-nav">
      <button class="nav-btn nav-prev" onclick="gPrevPage()"${page===0?' disabled':''}>← 上一页</button>
      <button class="nav-btn nav-next" id="g-next-btn" onclick="gNextPage()">${isLast?'查看结果 →':'下一页 →'}</button>
    </div>
  </div>`;
}

function setGA(i,v){
  S.gAns[i]=v;
  const pr=document.getElementById('gpr-'+i);if(!pr)return;
  pr.querySelectorAll('.g-btn').forEach((btn,bi)=>{btn.classList.toggle('sel',[2,1,0,-1,-2][bi]===v);});
}
function gNextPage(){
  const page=S.gPage,start=page*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,GRAW.length);
  let miss=0;for(let i=start;i<end;i++){if(S.gAns[i]===undefined)miss++;}
  if(miss>0){alert('还有'+miss+'道题未作答，请全部选择后继续。');return;}
  if(page>=Math.ceil(GRAW.length/PAGE_SIZE)-1){showGallupResult();}
  else{S.gPage++;renderGPage();window.scrollTo(0,0);}
}
function gPrevPage(){if(S.gPage>0){S.gPage--;renderGPage();window.scrollTo(0,0);}}

function calcGallup(){
  const sc={};ST.forEach(s=>sc[s.id]=0);
  GRAW.forEach(([idxA,,idxB,],i)=>{const v=S.gAns[i]||0;if(v>0)sc[ST[idxA].id]+=v;else if(v<0)sc[ST[idxB].id]+=(-v);});
  return ST.map(s=>({...s,score:sc[s.id]||0})).sort((a,b)=>b.score-a.score);
}

function showGallupResult(){
  const ranked=calcGallup();
  const top5ids=new Set(ranked.slice(0,5).map(s=>s.id));
  S.results.g={top5:ranked.slice(0,5),ranked};S.done.g=true;
  const domains={exec:[],influence:[],relation:[],strategy:[]};
  ranked.forEach((s,i)=>domains[s.domain].push({...s,gr:i+1}));
  const dd={exec:0,influence:0,relation:0,strategy:0};
  ranked.slice(0,5).forEach(s=>dd[s.domain]++);
  const md=Object.entries(dd).sort((a,b)=>b[1]-a[1])[0][0];
  const sumMap={exec:'你是「把事情做成」的人——有条不紊、承诺必达，在执行层面有天然优势',influence:'你是「让事情发生」的人——能点燃他人、推动前行，天生有感召力',relation:'你是「把人连接起来」的人——对他人高度敏感，善于建立信任',strategy:'你是「看清全局」的人——善于分析、前瞻规划，能看到别人看不到的可能性'};
  showOnly('gallup-result');
  document.getElementById('gallup-result-content').innerHTML=`
  <div class="rhero"><div class="re">💎</div>
    <h2>优势识别器 2.0 分析结果</h2>
    <p>你的前五大优势：${ranked.slice(0,5).map(s=>`<strong style="color:${DC[s.domain]}">${s.name}</strong>`).join(' · ')}</p>
    <p style="margin-top:8px;font-size:12px">${sumMap[md]}</p>
  </div>
  <div class="rcard"><h3>🗺️ 全 34 项优势分布（高亮为 TOP 5）</h3>
    <div style="display:flex;gap:5px">
      ${['exec','influence','relation','strategy'].map(dom=>`<div style="flex:1;min-width:0">
        <div style="font-size:9px;font-weight:700;color:${DC[dom]};text-align:center;padding:5px 2px;background:${DB[dom]};border-radius:6px 6px 0 0;margin-bottom:3px">${DN[dom]}</div>
        ${domains[dom].map(s=>{const isTop=top5ids.has(s.id);return`<div style="border-radius:7px;padding:6px 2px;text-align:center;margin-bottom:3px;background:${isTop?DC[dom]:DL[dom]};border:1.5px solid ${isTop?DC[dom]:DB[dom]}">
          <div style="font-size:9px;font-weight:700;color:${isTop?'rgba(255,255,255,.7)':'#9ca3af'}">${s.gr}</div>
          <div style="font-size:11px;font-weight:${isTop?800:600};color:${isTop?'white':DC[dom]}">${s.name}</div>
        </div>`;}).join('')}
      </div>`).join('')}
    </div>
  </div>
  <div class="rcard"><h3>💡 TOP 5 优势详解</h3>
    ${ranked.slice(0,5).map((s,i)=>`<div class="ins-item" style="border-color:${DC[s.domain]};background:${DL[s.domain]}">
      <h4 style="color:${DC[s.domain]}">#${i+1} ${s.name}（${DN[s.domain]}）</h4><p>${s.desc}</p>
    </div>`).join('')}
  </div>`;
  updateHomeStatus();
}

  document.getElementById('q-content').innerHTML=`<div class="qcard"${skip?' style="animation:none"':''}>

    <div class="h2-opts">
      <div class="h2-opt${ans===true?' yes':''}" onclick="ansH('${t}',${i},true)">✓ 符合</div>
      <div class="h2-opt${ans===false?' nope':''}" onclick="ansH('${t}',${i},false)">✗ 不符合</div>
    </div>
  </div>`;
}
function ansH(t,i,v){
  S.hAns[t+'_'+i]=v;
  setTimeout(()=>{const gi=hGlobal();if(gi===89){showHollandResult();return;}if(i<14)S.hIdx++;else{S.hType=S.hTypes[S.hTypes.indexOf(t)+1];S.hIdx=0;}renderH();},150);
}
function calcHolland(){
  const sc={R:0,I:0,A:0,S:0,E:0,C:0};
  Object.entries(S.hAns).forEach(([k,v])=>{if(v===true)sc[k.split('_')[0]]++;});
  return Object.entries(sc).sort((a,b)=>b[1]-a[1]);
}
function showHollandResult(){
  const sorted=calcHolland();
  const top3=sorted.slice(0,3).map(([t])=>t),combo=top3.join('');

  document.getElementById('holland-result-content').innerHTML=`
  <div class="rhero" style="border-top:4px solid ${HI[mt].color}"><div class="re">${HI[mt].emoji}</div>
    <h2>霍兰德职业兴趣 SDS 结果</h2>
    <p>你的类型组合：<strong style="color:${HI[mt].color};font-size:22px">${combo}</strong>（${top3.map(t=>HI[t].name).join(' × ')}）</p>
  </div>
  <div class="rcard"><h3>📊 六大类型得分</h3>
    ${sorted.map(([t,v])=>{const info=HI[t];const pct=Math.round(v/15*100);return`<div class="hb-row">
      <div class="hb-top"><span class="hb-nm" style="color:${info.color}">${info.emoji} ${info.letter}—${info.name}</span><span class="hb-sc">${v} / 15分</span></div>
      <div class="hb-track"><div class="hb-fill" style="width:0%;background:${info.fill}" data-w="${pct}"></div></div>
    </div>`;}).join('')}
  </div>
  <div class="rcard"><h3>📋 各类型主要特征与典型职业</h3>
    <table class="h-type-table">
      <tr><th>类型</th><th>得分</th><th>主要特征与典型职业</th></tr>
      ${sorted.map(([t,v],idx)=>{const info=HI[t];const d=H_DESC[t];return`<tr${idx<3?' class="top3"':''}><td style="font-weight:700;color:${info.color};white-space:nowrap">${info.emoji} ${info.letter}—${info.name}</td>
        <td style="font-weight:700;color:${info.color};text-align:center">${v}</td>
        <td><strong>主要特征：</strong>${d.main}<br><span style="color:#6b7280"><strong>典型职业：</strong>${d.career}</span></td></tr>`;}).join('')}
    </table>
  </div>
  <div class="rcard"><h3>🎯 组合类型推荐</h3>
    <table class="h-combo-table">
      <tr><th>组合类型</th><th>推荐专业 / 职业方向</th></tr>
      <tr><td style="font-weight:800;color:${HI[mt].color};font-size:15px">${combo}</td><td>${comboCareer}</td></tr>
    </table>
    <p style="font-size:11px;color:#a89fc0;margin-top:10px;line-height:1.6">说明：霍兰德职业兴趣测验(SDS)共6个基本类型，按字母表示为R、A、I、S、E、C，以分数从高到低排序，选择最高的三项即可得到组合类型。</p>
  </div>`;
  setTimeout(()=>document.querySelectorAll('.hb-fill').forEach(el=>{el.style.width=el.dataset.w+'%';}),100);

// ════ MBTI ════
function startMbti(){S.mode='mbti';S.mIdx=0;S.mAns={};showOnly('test-view');document.getElementById('btn-prev').style.display='block';renderM();}
function renderM(skip){
  const i=S.mIdx,q=MQ[i],ans=S.mAns[i];
  const dc={EI:'#6366f1',SN:'#f59e0b',TF:'#ec4899',JP:'#10b981'},c=dc[q.dim];
  document.getElementById('prog-lbl').textContent='MBTI 人格测试';
  document.getElementById('prog-num').textContent=(i+1)+' / 60';
  const fill=document.getElementById('prog-fill');
  fill.style.width=Math.round(i/60*100)+'%';fill.className='prog-fill fill-m';
  document.getElementById('btn-prev').style.opacity=i===0?'0.3':'1';
  document.getElementById('q-content').innerHTML=`<div class="qcard"${skip?' style="animation:none"':''}>
    <h3>${q.q}</h3>
    <div class="m-opts">
      ${M_OPTS.map(o=>`<div class="m-opt${ans===o.v?' sel':''}" onclick="ansM(${i},${o.v})"
        style="${ans===o.v?'background:'+c+';border-color:'+c:''}">
        ${o.label.replace('\n','<br>')}
      </div>`).join('')}
    </div>
  </div>`;
}
function ansM(i,v){S.mAns[i]=v;setTimeout(()=>{i<59?(S.mIdx=i+1,renderM()):showMbtiResult();},150);}
function prevQ(){
  if(S.mode==='holland'){const gi=hGlobal();if(gi===0)return;if(S.hIdx>0)S.hIdx--;else{S.hType=S.hTypes[S.hTypes.indexOf(S.hType)-1];S.hIdx=14;}renderH(true);}
  else if(S.mode==='mbti'){if(S.mIdx>0){S.mIdx--;renderM(true);}}
}

function calcMbti(){
  const dims={EI:0,SN:0,TF:0,JP:0};
  MQ.forEach((q,i)=>{const v=S.mAns[i];if(v!=null)dims[q.dim]+=v*q.dir;});
  return{type:(dims.EI>=0?'E':'I')+(dims.SN>=0?'S':'N')+(dims.TF>=0?'T':'F')+(dims.JP>=0?'J':'P'),dims};
}
function showMbtiResult(){
  const{type,dims}=calcMbti();
  const info=MBTI_INFO[type]||{name:type,emoji:'🧬',role:'',color:'#6366f1',core:'',long:'',pros:[],cons:[],relation:'',career:'',avoid:''};
  S.results.m={type,dims,info};S.done.m=true;
  const mx=30;
  function dp(d){return Math.round((dims[d]/mx+1)/2*100);}
  const ps={EI:dp('EI'),SN:dp('SN'),TF:dp('TF'),JP:dp('JP')};
  const dis=[
    {l:'E 外向',r:'I 内向',color:'#6366f1',p:ps.EI,dom:ps.EI>=50?'E 外向':'I 内向',ps:ps.EI>=50?ps.EI:100-ps.EI},
    {l:'S 感觉',r:'N 直觉',color:'#f59e0b',p:ps.SN,dom:ps.SN>=50?'S 感觉':'N 直觉',ps:ps.SN>=50?ps.SN:100-ps.SN},
    {l:'T 思考',r:'F 情感',color:'#ec4899',p:ps.TF,dom:ps.TF>=50?'T 思考':'F 情感',ps:ps.TF>=50?ps.TF:100-ps.TF},
    {l:'J 判断',r:'P 感知',color:'#10b981',p:ps.JP,dom:ps.JP>=50?'J 判断':'P 感知',ps:ps.JP>=50?ps.JP:100-ps.JP},
  ];
  showOnly('mbti-result');
  document.getElementById('mbti-result-content').innerHTML=`
  <div class="rhero" style="border-top:4px solid ${info.color}"><div class="re">${info.emoji}</div>
    <div class="mbti-type-big" style="background:linear-gradient(135deg,${info.color},${info.color}88);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${type}</div>
    <span class="mbti-role-tag" style="background:${info.color}18;color:${info.color}">${info.role} · ${info.name}</span>
    <p>${info.core}</p>
  </div>
  <div class="rcard"><h3>🧬 四维度分析</h3>
    <div class="mbti-dim-grid">
      ${dis.map(d=>`<div class="mbti-dim">
        <div class="dd-label">${d.dom} 倾向 ${d.ps}%</div>
        <div class="dd-bar"><div class="dd-fill" data-w="${d.p}" style="width:0%;background:${d.color}"></div></div>
        <div class="dd-vals"><span>${d.l}</span><span>${d.r}</span></div>
      </div>`).join('')}
    </div>
  </div>
  <div class="rcard"><h3>📖 人格深度解读</h3><p style="font-size:13px;color:#374151;line-height:1.75">${info.long}</p></div>
  <div class="rcard"><h3>💪 优势与弱点</h3>
    <div class="mbti-pc">
      <div class="mbti-pros"><h5>✅ 核心优势</h5><ul>${info.pros.map(p=>'<li>'+p+'</li>').join('')}</ul></div>
      <div class="mbti-cons"><h5>⚠️ 潜在弱点</h5><ul>${info.cons.map(c=>'<li>'+c+'</li>').join('')}</ul></div>
    </div>
  </div>
  <div class="rcard"><h3>💼 适合的职业方向</h3>
    <div style="margin-bottom:10px">${info.career.split('、').map((c,i)=>'<span class="'+(i<3?'cc1':'cc2')+'">'+c+'</span>').join('')}</div>
    <div class="ins-item" style="border-color:#ef4444;background:#fff1f2">
      <h4 style="color:#9f1239">⚠️ 需要留意的工作类型</h4><p>${info.avoid}——长期从事可能导致能量消耗和职业倦怠。</p>
    </div>
  </div>
  <div class="rcard"><h3>❤️ 人际关系与沟通</h3><p style="font-size:13px;color:#374151;line-height:1.75">${info.relation}</p></div>`;
  setTimeout(()=>document.querySelectorAll('.dd-fill').forEach(el=>{el.style.width=el.dataset.w+'%';}),100);
  updateHomeStatus();
}

// ════ 综合结果 ════
function showComboResult(){
  const g=S.results.g,h=S.results.h,m=S.results.m;
  const top5=g.top5,hTop=h.top3[0],combo=h.combo,mbtiType=m.type,mbtiInfo=m.info;
  const dd={exec:0,influence:0,relation:0,strategy:0};
  top5.forEach(s=>dd[s.domain]++);
  const md=Object.entries(dd).sort((a,b)=>b[1]-a[1])[0][0];

  const careers=[];

  else if(hTop==='S'){careers.push({t:1,dir:'HR/组织发展',jobs:'HRBP、培训经理、企业文化总监',logic:'S社会型+'+DN[md]+'：有帮助他人的驱动力，又有落地能力'});careers.push({t:1,dir:'客户成功/运营',jobs:'客户成功经理、运营经理、项目经理',logic:'社交敏感+执行类优势：沟通顺畅，有条不紊，能解决问题'});careers.push({t:2,dir:'教育/咨询',jobs:'职业顾问、培训师、心理咨询师',logic:'S型最适合一对一深度服务'});}
  else if(hTop==='I'){careers.push({t:1,dir:'数据/研究',jobs:'数据分析师、战略研究员、咨询顾问',logic:'I研究型+'+DN[md]+'：天然的分析气质，享受深度研究'});careers.push({t:1,dir:'产品/策略',jobs:'产品经理、用户研究员、策略分析师',logic:'研究型能把复杂问题转化为可执行方案'});careers.push({t:2,dir:'工程/技术',jobs:'软件工程师、系统架构师、技术顾问',logic:'I型+逻辑优势：技术路线也是很好的选择'});}
  else if(hTop==='E'){careers.push({t:1,dir:'商业/创业',jobs:'创始人、市场总监、BD总监',logic:'E企业型+'+DN[md]+'：天生的商业嗅觉+驱动他人的能力'});careers.push({t:1,dir:'营销/销售管理',jobs:'营销总监、销售总监、商务拓展',logic:'竞争型兴趣+影响力优势：擅长开局和说服'});careers.push({t:2,dir:'项目管理',jobs:'项目经理、运营总监、事业部负责人',logic:'E型执行力+领导气质：推动大项目的好手'});}
  else if(hTop==='C'){careers.push({t:1,dir:'财务/风控',jobs:'财务总监、CFO、风控经理',logic:'C传统型+'+DN[md]+'：对秩序和精确度的双重要求'});careers.push({t:1,dir:'项目管理/运营',jobs:'项目经理、PMO、运营总监',logic:'纪律+专注：项目管理的核心气质'});careers.push({t:2,dir:'行政/合规',jobs:'行政总监、法务经理、合规专员',logic:'C型对规则的天然敬重在法务合规领域是核心竞争力'});}
  else{careers.push({t:1,dir:'技术/工程',jobs:'工程师、建筑师、技术总监',logic:'实际型兴趣匹配专业技术路线'});目经理、技术顾问、运营负责人',logic:'技术背景转管理路线'});}
  careers.push({t:2,dir:'综合顾问',jobs:'管理咨询顾问、行业分析师',logic:'三维综合型人才，适合需要跨领域判断的顾问角色'});

  const blindspots=[];
  if((hScores.E||0)<3)blindspots.push({t:'主动竞争/强销售场景',d:'霍兰德E型得分较低，主动争抢资源、强势推销不是你的舒适区，选职业时尽量回避纯对抗性销售岗位。'});
  if(top5.some(s=>s.id==='deliberative')&&top5.some(s=>s.id==='maximizer'||s.name==='追求'))blindspots.push({t:'完美主义带来效率焦虑',d:'审慎+追求叠加，容易在「够好了吗」上耗费过多时间，需有意识设定「够用标准」，允许交付80分成果。'});

  if(mbtiType[0]==='I')blindspots.push({t:'内向特质在高曝光岗位的挑战',d:'内倾型在高强度社交中容易消耗，选岗位时优先考虑有独立工作空间的环境，给自己留足恢复时间。'});

  showOnly('combo-result');
  document.getElementById('combo-result-content').innerHTML=`

    <div class="combo-tags">

  <div class="rcard"><h3>✨ 核心优势画像</h3>

      <h4 style="color:#4338ca;font-size:14px">「${comboName()}」</h4>
      <p style="font-size:13px">三份测试交叉后，你的核心在于：<strong>${top5[0].name}</strong>（${top5[0].desc}）与 <strong>${HI[hTop].name}型</strong>兴趣叠加，加上 <strong>${mbtiInfo.name}</strong>的行事风格——三者构成你区别于他人的独特组合。</p>
    </div>
    ${top5.map((s,i)=>`<div class="ins-item" style="border-color:${DC[s.domain]};background:${DL[s.domain]}">
      <h4 style="color:${DC[s.domain]}">#${i+1} ${s.name}（${DN[s.domain]}）</h4><p>${s.desc}</p>
    </div>`).join('')}
  </div>
  <div class="rcard"><h3>🎯 最适合你的职业方向</h3>
    <table class="career-table">
      <tr><th>梯队</th><th>方向</th><th>具体职业</th><th>匹配逻辑</th></tr>
      ${careers.map(r=>`<tr><td><span class="${r.t===1?'t1':'t2'}">${r.t===1?'🥇 首选':'🥈 备选'}</span></td>
        <td style="font-weight:600;font-size:12px">${r.dir}</td>
        <td style="font-size:12px;color:#374151">${r.jobs}</td>
        <td style="font-size:11px;color:#6b7280">${r.logic}</td></tr>`).join('')}
    </table>
  </div>
  ${blindspots.length?`<div class="rcard"><h3>⚠️ 潜在盲区提示</h3>
    ${blindspots.map(b=>`<div class="ins-item" style="border-color:#f59e0b;background:#fffbf0">
      <h4 style="color:#92400e">${b.t}</h4><p>${b.d}</p></div>`).join('')}
  </div>`:''}
  <div class="rcard"><h3>💡 给你的一句话</h3>
    <div style="background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:16px;padding:20px;color:white;text-align:center">

    </div>
  </div>`;
}

showOnly('home');updateHomeStatus();
